<div class="language-picker" data-language-picker>
    <button type="button" class="header-action header-action--icon language-picker-toggle"
        data-language-toggle aria-label="Choose language" aria-haspopup="menu" aria-expanded="false"
        aria-controls="language-menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" x2="22" y1="12" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
    </button>
    <div id="language-menu" class="language-picker-menu" role="menu" data-language-menu hidden>
        <button type="button" role="menuitemradio" aria-checked="true" data-language="en" translate="no">English</button>
        <button type="button" role="menuitemradio" aria-checked="false" data-language="zh-CN" translate="no">简体中文</button>
        <button type="button" role="menuitemradio" aria-checked="false" data-language="zh-TW" translate="no">繁體中文</button>
        <button type="button" role="menuitemradio" aria-checked="false" data-language="ko" translate="no">한국어</button>
        <button type="button" role="menuitemradio" aria-checked="false" data-language="nl" translate="no">Nederlands</button>
    </div>
</div>
