name: Monthly source refresh

on:
  schedule:
    - cron: '47 16,20,23 28 * *'
    - cron: '47 4 29 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Check source access or refresh from completed releases
        type: choice
        default: preflight
        options: [preflight, update]

permissions:
  contents: write

concurrency:
  group: monthly-source-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out the application
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Check browser-facing helpers
        run: |
          node tests/settings.test.js static/analysis-settings.js
          node tests/navigation.test.js
      - name: Check out completed metaPee releases
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: YushuShi/metaPee
          ref: main
          path: '.sources/metaPee'
          ssh-key: ${{ secrets.SOURCE_METAPEE_SSH_KEY }}
          persist-credentials: false
      - name: Check out completed MetaVir releases
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: YushuShi/MetaVir
          ref: main
          path: '.sources/MetaVir'
          ssh-key: ${{ secrets.SOURCE_METAVIR_SSH_KEY }}
          persist-credentials: false
      - name: Check completed source releases
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preflight'
        run: python -m automation.monthly_refresh --repos-root .sources --preflight
      - name: Install plot fonts
        if: github.event_name == 'schedule' || inputs.mode == 'update'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk
      - name: Refresh from completed monthly releases
        if: github.event_name == 'schedule' || inputs.mode == 'update'
        run: python -m automation.monthly_refresh --repos-root .sources
      - name: Publish validated application updates
        if: github.event_name == 'schedule' || inputs.mode == 'update'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- updates summary
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh monthly results from validated source releases'
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
