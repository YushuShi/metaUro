name: Monthly evidence update

on:
  schedule:
    - cron: '47 16 28 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Check services or run independent urinary evidence pipelines
        type: choice
        default: preflight
        options: [preflight, update]

permissions:
  contents: write
  actions: read

concurrency:
  group: monthly-evidence-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      CORNELL_API_KEY: ${{ secrets.CORNELL_API_KEY }}
      CORNELL_API_BASE_URL: ${{ secrets.CORNELL_API_BASE_URL || secrets.API_BASE_URI }}
      MONTHLY_REQUIRE_VALID_NCBI_KEY: 'false'
    steps:
      - name: Check out the V2 application and results
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # Scheduled workflows start on main; evidence releases belong on V2.
          ref: V2
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pytest jsonschema
      - name: Install and verify the exact PDF reader
        run: bash automation/install_poppler.sh "$RUNNER_TEMP/poppler-26.07.0"
      - name: Check browser-facing helpers
        run: |
          node tests/settings.test.js static/analysis-settings.js
          node tests/navigation.test.js
      - name: Check standalone runtime and model availability
        run: python -m automation.autonomous_monthly preflight --gateway
      - name: Install plot fonts
        if: github.event_name == 'schedule' || inputs.mode == 'update'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk
      - name: Validate release safeguards
        run: python -m pytest tests/test_autonomous_monthly.py tests/test_source_updates.py tests/test_trend_ci_guard.py tests/test_release_artifact_policy.py tests/test_autonomous_native_reports.py tests/test_monthly_transport.py tests/test_poppler_runtime.py -q
      - name: Validate urinary NCBI fallback
        working-directory: runtime_code/monthly/metaPee
        run: python -m pytest tests/test_ncbi_throttle.py -q
      - name: Validate prostate NCBI fallback
        working-directory: runtime_code/monthly/MetaVir
        run: python -m pytest tests/test_ncbi_throttle.py -q
      - name: Restore interrupted screening receipts
        if: github.event_name == 'schedule' || inputs.mode == 'update'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m automation.autonomous_monthly restore
      - name: Search, screen independently, extract, and pool
        if: github.event_name == 'schedule' || inputs.mode == 'update'
        run: python -m automation.autonomous_monthly prepare
      - name: Validate and seal application updates
        if: github.event_name == 'schedule' || inputs.mode == 'update'
        run: python -m automation.autonomous_monthly publish
      - name: Publish complete evidence release and human-review queue
        if: github.event_name == 'schedule' || inputs.mode == 'update'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- updates summary monthlyHumanReview runtime_code manualReview/preprint_recovery
          python -m automation.autonomous_monthly verify-index
          if ! git diff --cached --quiet; then
            git commit -m 'Publish autonomous monthly urinary evidence update'
            git push origin "HEAD:V2"
          fi
      - name: Preserve in-flight paid screening receipts
        if: always() && (failure() || cancelled()) && (github.event_name == 'schedule' || inputs.mode == 'update')
        run: python -m automation.autonomous_monthly checkpoint
      - name: Save interrupted paid screening receipts
        if: always() && (failure() || cancelled()) && (github.event_name == 'schedule' || inputs.mode == 'update')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metauro-monthly-checkpoint
          path: |
            updates/monthly/
            .monthly-checkpoint/preprint_recovery/
            manualReview/preprint_recovery/
            monthlyHumanReview/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
